<!DOCTYPE html>
<html>
<head>
<title>ClassQuest - Assignment Tracker</title>

<style>
*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    margin:0;
    padding:0;
    background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
    color:white;
    min-height:100vh;
}

/* =========================
   LOGIN PAGE
========================= */

#loginPage{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    animation:fadeIn 0.8s ease;
}

.login-card{
    width:100%;
    max-width:420px;
    background:rgba(255,255,255,0.1);
    padding:35px;
    border-radius:20px;
    backdrop-filter:blur(15px);
    box-shadow:0 0 30px rgba(0,0,0,0.4);
    text-align:center;
}

.login-card h1{
    margin-bottom:5px;
    font-size:34px;
}

.login-card p{
    color:#ccc;
    margin-bottom:25px;
}

.login-input{
    width:100%;
    padding:14px;
    margin:8px 0;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:15px;
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:70px;
}

.show-password{
    position:absolute;
    right:8px;
    top:8px;
    padding:7px 10px;
    border:none;
    border-radius:7px;
    cursor:pointer;
    background:#333;
    color:white;
}

.login-button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    background:linear-gradient(90deg,#7f00ff,#e100ff);
    color:white;
    transition:0.2s;
}

.login-button:hover{
    transform:scale(1.03);
    box-shadow:0 0 20px rgba(225,0,255,0.5);
}

.error{
    color:#ff4d4d;
    margin-top:15px;
    display:none;
    font-weight:bold;
}

.login-hint{
    font-size:12px;
    color:#888;
    margin-top:20px;
}

/* =========================
   MAIN APP
========================= */

#app{
    display:none;
}

.container{
    max-width:900px;
    margin:30px auto;
    padding:20px;
    animation:fadeIn 1s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.card{
    background:rgba(255,255,255,0.1);
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    backdrop-filter:blur(10px);
}

/* =========================
   INPUTS
========================= */

input,
select,
button{
    padding:10px;
    margin:5px;
    border-radius:8px;
    border:none;
}

button{
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    transform:scale(1.05);
}

/* =========================
   ASSIGNMENTS
========================= */

.assignment{
    background:rgba(255,255,255,0.12);
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    animation:pop 0.3s ease;
}

@keyframes pop{
    from{
        transform:scale(0.9);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }
}

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
}

.high{
    background:red;
}

.medium{
    background:orange;
}

.low{
    background:green;
}

/* =========================
   DUE WARNINGS
========================= */

.overdue{
    color:#ff4d4d;
    font-weight:bold;
}

.today{
    color:#ffd700;
    font-weight:bold;
}

.tomorrow{
    color:#00e6e6;
    font-weight:bold;
}

/* =========================
   XP BAR
========================= */

.xpbar{
    width:100%;
    height:14px;
    background:rgba(255,255,255,0.2);
    border-radius:10px;
    overflow:hidden;
    margin-top:8px;
}

.xpfill{
    height:100%;
    width:0%;
    background:lime;
    transition:0.5s;
}

/* =========================
   XP GLOW
========================= */

.glow{
    box-shadow:
        0 0 15px lime,
        0 0 25px lime;
    animation:pulse 1s infinite alternate;
}

@keyframes pulse{
    from{
        box-shadow:0 0 10px lime;
    }

    to{
        box-shadow:0 0 25px lime;
    }
}

#xp{
    font-size:18px;
}

/* =========================
   LOGOUT
========================= */

.logout{
    background:#ff3b3b;
    color:white;
    float:right;
}

.clear{
    clear:both;
}
</style>

</head>

<body>

<!-- =========================
     LOGIN PAGE
========================= -->

<div id="loginPage">

    <div class="login-card">

        <h1>🔐 ClassQuest</h1>

        <p>Enter your class credentials to continue</p>

        <input
            class="login-input"
            id="classCode"
            placeholder="Class Code"
            autocomplete="off"
        >

        <div class="password-box">

            <input
                class="login-input"
                id="classPassword"
                type="password"
                placeholder="Class Password"
            >

            <button
                class="show-password"
                onclick="togglePassword()"
            >
                Show
            </button>

        </div>

        <button
            class="login-button"
            onclick="login()"
        >
            ENTER CLASS 🚀
        </button>

        <div
            id="loginError"
            class="error"
        >
            ❌ Incorrect class code or password
        </div>

        <div class="login-hint">
            ClassQuest • Class Access
        </div>

    </div>

</div>


<!-- =========================
     MAIN APP
========================= -->

<div id="app">

<div class="container">

<!-- PROFILE -->

<div class="card">

<button
    class="logout"
    onclick="logout()"
>
    🔒 Lock
</button>

<div class="clear"></div>

<h2 id="name">🎮 Player</h2>

<h3 id="rank">
Rank: Bronze I
</h3>

<p>
XP:
<span id="xp">0</span>
</p>

<div class="xpbar">

<div
    class="xpfill"
    id="xpfill"
></div>

</div>

</div>


<!-- INPUT -->

<div class="card">

<input
    id="task"
    placeholder="Assignment"
>

<input
    id="date"
    type="date"
>

<select id="priority">

<option value="low">
Low
</option>

<option value="medium">
Medium
</option>

<option value="high">
High
</option>

</select>

<button
    onclick="addTask()"
>
Add
</button>

</div>


<!-- LIST -->

<div id="list"></div>

</div>

</div>


<script>

/* =====================================================
   CLASS ACCESS SETTINGS
   CHANGE THESE TWO VALUES IF YOU WANT
===================================================== */

const CLASS_CODE = "20267C";

const CLASS_PASSWORD = "classroom26";


/* =====================================================
   LOGIN SYSTEM
===================================================== */

function login(){

    let code =
        document.getElementById("classCode").value.trim();

    let password =
        document.getElementById("classPassword").value;

    let error =
        document.getElementById("loginError");


    if(
        code === CLASS_CODE &&
        password === CLASS_PASSWORD
    ){

        localStorage.setItem(
            "classQuestAccess",
            "true"
        );

        document.getElementById("loginPage").style.display="none";

        document.getElementById("app").style.display="block";

        error.style.display="none";

        updateUI();

    }else{

        error.style.display="block";

    }
}


/* =====================================================
   SHOW / HIDE PASSWORD
===================================================== */

function togglePassword(){

    let password =
        document.getElementById("classPassword");

    let button =
        document.querySelector(".show-password");

    if(password.type === "password"){

        password.type="text";

        button.innerText="Hide";

    }else{

        password.type="password";

        button.innerText="Show";

    }
}


/* =====================================================
   LOGOUT / LOCK
===================================================== */

function logout(){

    localStorage.removeItem(
        "classQuestAccess"
    );

    document.getElementById("app").style.display="none";

    document.getElementById("loginPage").style.display="flex";

    document.getElementById("classCode").value="";

    document.getElementById("classPassword").value="";

    document.getElementById("loginError").style.display="none";
}


/* =====================================================
   AUTOMATIC LOGIN CHECK
===================================================== */

function checkAccess(){

    let access =
        localStorage.getItem(
            "classQuestAccess"
        );

    if(access === "true"){

        document.getElementById("loginPage").style.display="none";

        document.getElementById("app").style.display="block";

    }else{

        document.getElementById("loginPage").style.display="flex";

        document.getElementById("app").style.display="none";

    }
}


/* =====================================================
   DATA
===================================================== */

let tasks =
    JSON.parse(
        localStorage.getItem("tasks")
    ) || [];

let xp =
    parseInt(
        localStorage.getItem("xp")
    ) || 0;


/* =====================================================
   SAVE
===================================================== */

function save(){

    localStorage.setItem(
        "tasks",
        JSON.stringify(tasks)
    );

    localStorage.setItem(
        "xp",
        xp
    );

    updateUI();
}


/* =====================================================
   RANK SYSTEM
===================================================== */

function getRank(xp){

    if(xp>=22000)
        return "Grandmaster";

    if(xp>=16000)
        return "Heroic";

    if(xp>=12000)
        return "Diamond II";

    if(xp>=9000)
        return "Diamond I";

    if(xp>=7000)
        return "Platinum III";

    if(xp>=5500)
        return "Platinum II";

    if(xp>=4000)
        return "Platinum I";

    if(xp>=3000)
        return "Gold III";

    if(xp>=2300)
        return "Gold II";

    if(xp>=1700)
        return "Gold I";

    if(xp>=1200)
        return "Silver III";

    if(xp>=800)
        return "Silver II";

    if(xp>=500)
        return "Silver I";

    if(xp>=250)
        return "Bronze III";

    if(xp>=100)
        return "Bronze II";

    return "Bronze I";
}


/* =====================================================
   DUE DATE STATUS
===================================================== */

function getDueStatus(date){

    if(!date)
        return "";

    let d =
        new Date(date);

    let today =
        new Date();

    let diff =
        Math.ceil(
            (d-today) /
            (1000*60*60*24)
        );

    if(diff < 0)
        return "overdue";

    if(diff === 0)
        return "today";

    if(diff === 1)
        return "tomorrow";

    return "";
}


/* =====================================================
   AUTO DELETE COMPLETED TASKS AFTER 24 HOURS
===================================================== */

function cleanTasks(){

    let now =
        Date.now();

    tasks =
        tasks.filter(t=>{

            if(!t.done)
                return true;

            if(!t.doneAt)
                return true;

            return
                (now - t.doneAt)
                < 86400000;

        });

}


/* =====================================================
   ADD TASK
===================================================== */

function addTask(){

    let task =
        document.getElementById("task").value.trim();

    let date =
        document.getElementById("date").value;

    let priority =
        document.getElementById("priority").value;


    if(!task)
        return;


    tasks.push({

        text:task,

        date:date,

        priority:priority,

        done:false,

        doneAt:null

    });


    save();


    /* CLEAR INPUTS */

    document.getElementById("task").value="";

    document.getElementById("date").value="";

    document.getElementById("priority").value="low";

}


/* =====================================================
   COMPLETE TASK
===================================================== */

function completeTask(i){

    if(!tasks[i].done){

        let bonus = 50;


        if(
            tasks[i].priority === "high"
        ){

            bonus += 25;

        }


        let status =
            getDueStatus(
                tasks[i].date
            );


        if(status === "today")
            bonus += 10;


        if(status === "tomorrow")
            bonus += 25;


        if(status === "overdue")
            bonus = 0;


        xp += bonus;


        tasks[i].done = true;

        tasks[i].doneAt =
            Date.now();

    }


    save();

}


/* =====================================================
   DELETE TASK
===================================================== */

function deleteTask(i){

    tasks.splice(i,1);

    save();

}


/* =====================================================
   UPDATE UI
===================================================== */

function updateUI(){

    cleanTasks();


    document.getElementById(
        "xp"
    ).innerText = xp;


    document.getElementById(
        "rank"
    ).innerText =
        "Rank: " + getRank(xp);


    /* XP BAR */

    let rankList = [

        100,
        250,
        500,
        800,
        1200,
        1700,
        2300,
        3000,
        4000,
        5500,
        7000,
        9000,
        12000,
        16000,
        22000

    ];


    let nextRank = 22000;


    for(let r of rankList){

        if(xp < r){

            nextRank = r;

            break;

        }

    }


    let percent =
        (xp / nextRank) * 100;


    if(xp >= 22000)
        percent = 100;


    let bar =
        document.getElementById(
            "xpfill"
        );


    bar.style.width =
        percent + "%";


    /* GLOW CLOSE TO NEXT RANK */

    let glowZone =
        nextRank - 300;


    if(
        xp >= glowZone &&
        xp < nextRank
    ){

        document
            .querySelector(".xpbar")
            .classList.add("glow");

    }else{

        document
            .querySelector(".xpbar")
            .classList.remove("glow");

    }


    /* TASK LIST */

    let html = "";


    tasks.forEach((t,i)=>{

        let status =
            getDueStatus(
                t.date
            );


        html += `

        <div class="assignment">

            <h3>
                ${t.text}
            </h3>

            <p>
                📅
                ${t.date || "No date"}
            </p>

            <p class="badge ${t.priority}">
                ${t.priority.toUpperCase()}
            </p>

            <p class="${status}">
                ${
                    status
                    ? status.toUpperCase()
                    : ""
                }
            </p>

            <button
                onclick="completeTask(${i})"
            >
                ${
                    t.done
                    ? "Completed"
                    : "Complete"
                }
            </button>

            <button
                onclick="deleteTask(${i})"
            >
                Delete
            </button>

        </div>

        `;

    });


    document.getElementById(
        "list"
    ).innerHTML = html;

}


/* =====================================================
   START APP
===================================================== */

checkAccess();

if(
    localStorage.getItem(
        "classQuestAccess"
    ) === "true"
){

    updateUI();

}

</script>

</body>
</html>
